# OpenTelemetry Collector Builder (OCB) manifest.
# Builds a custom collector embedding the agent-trajectory-guard processor.
#
#   go run go.opentelemetry.io/collector/cmd/builder@v0.155.0 --config builder-config.yaml
#
# The processor module lives at the repo root and is pulled in via a local
# `replaces` directive (it is not published yet).
dist:
  name: otelcol-trajectory-guard
  description: Custom OTel Collector embedding agent-trajectory-guard
  output_path: ./_build
  otelcol_version: 0.155.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.155.0

processors:
  # The processor under development. `name` is the Go package name (it differs
  # from the module path's last segment), so OCB calls agenttrajectoryguard.NewFactory().
  - gomod: github.com/AndreyChegdomin/otel-agent-reasoning-operator v0.0.0
    name: agenttrajectoryguard

exporters:
  # debug exporter prints spans (and our security.violation annotations) to stdout.
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.155.0
  # file exporter captures the annotated output as JSON for offline analysis.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.155.0

replaces:
  - github.com/AndreyChegdomin/otel-agent-reasoning-operator => ../
