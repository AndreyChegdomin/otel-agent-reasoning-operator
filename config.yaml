# Example collector pipeline wiring the agent-trajectory-guard processor.
# Run the built binary with:
#   ./_build/otelcol-trajectory-guard --config config.yaml
#
# NOTE (see REAL_RUN_NOTES.md): keep destructive_tools to specific tools (not a
# broad shell tool like Bash) and protected_resources to concrete paths/globs
# (not broad substrings), or Level 0 over-flags on benign commands.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  agenttrajectoryguard:
    mode: annotate            # annotate | drop
    eviction_timeout: 5m
    # Level 0 + Level 1a seeds:
    destructive_tools: [delete_file, rm, drop_table, delete_object]
    protected_resources: ["/etc/secrets/", "production.db", "**/.env"]
    # Level 1a egress surface:
    egress_tools: [send_email, http_post, http_request, upload_file]
    # Level 1a directed-taint role keys: extend to match your instrumentation's
    # argument schema (e.g. Claude Code-style tools use file_path / command):
    # taint_source_keys: [file_path, command, content]
    # taint_sink_keys: [file_path]
    taint_strict_roles: false
    # Capacity caps (anti-DoS):
    max_steps_per_trajectory: 10000
    max_taint_entries: 50000
    # Level 1c shape-only detectors (payload-free; work on redacted telemetry):
    shape_detectors_enabled: true
    read_tools: [read_file, Read, get_object, cat, fetch]
    write_tools: [write_file, Write, put_object]
    size_read_threshold: 1000000      # bytes; large-read trigger
    size_egress_ratio: 0.5            # egress/read size ratio to flag
    size_window_steps: 10
    size_window_duration: 60s
    sequence_patterns:                # opt-in; empty = off
      - name: recon_then_egress
        pattern: [read+, egress]
    # Level 1b/2 are opt-in:
    max_deletes: 0
    consistency_enabled: false

exporters:
  debug:
    verbosity: detailed       # prints spans + our security.violation attrs
  file:
    path: ./run-output.json   # capture annotated output as JSON for analysis

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [agenttrajectoryguard]
      exporters: [debug, file]
